<header th:fragment="header" class="site-header">
    <div class="container nav-wrapper">
        <a class="brand" th:href="@{/}">TIENDAS URBANO</a>

        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-menu">
            <span></span><span></span><span></span>
        </button>

        <nav id="main-menu" class="main-nav" aria-label="Navegación principal">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/catalog}">Nueva colección</a>
            <a th:href="@{/catalog}">Ropa</a>
            <a th:href="@{/catalog}">Chaquetas</a>
            <a th:href="@{/catalog}">Blazers</a>
            <a th:href="@{/catalog}">Ofertas</a>
        </nav>

        <div class="nav-icons">
            <a th:href="@{/catalog}" aria-label="Buscar" class="icon-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 2a6 6 0 1 0 3.88 10.58l4.77 4.77 1.41-1.42-4.76-4.76A6 6 0 0 0 10 4z"/></svg>
            </a>
            <a th:href="@{/login}" aria-label="Cuenta" class="icon-btn">

            </a>
            <a th:href="@{/cart}" aria-label="Carrito" class="icon-btn cart-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h-2v2h1l2.4 8.59A3 3 0 0 0 11.29 17h5.42a3 3 0 0 0 2.89-2.17L21 9H9.42l-.56-2H7zm4 15a2 2 0 1 0 .001 3.999A2 2 0 0 0 11 19zm6 0a2 2 0 1 0 .001 3.999A2 2 0 0 0 17 19z"/></svg>
                <span id="cart-count" class="cart-count">0</span>
            </a>
        </div>
    </div>
</header>
