<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendas Urbano | Registro</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="section">
    <div class="container form-page">
        <h1>Crear cuenta</h1>
        <p>Las cuentas públicas se crean únicamente con el rol CLIENTE.</p>
        <p th:if="${registrationError}" class="form-error" role="alert" th:text="${registrationError}"></p>
        <form method="post" th:action="@{/register}" th:object="${registration}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <label for="name">Nombre completo</label>
            <input id="name" th:field="*{name}" type="text" autocomplete="name" required>
            <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></small>
            <label for="rut">RUT</label>
            <input id="rut" th:field="*{rut}" type="text" placeholder="12.345.678-9" required>
            <small th:if="${#fields.hasErrors('rut')}" th:errors="*{rut}" class="form-error"></small>
            <label for="email">Correo electrónico</label>
            <input id="email" th:field="*{email}" type="email" autocomplete="email" required>
            <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></small>
            <label for="phone">Teléfono</label>
            <input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" required>
            <small th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="form-error"></small>
            <label for="password">Contraseña</label>
            <input id="password" th:field="*{password}" type="password" autocomplete="new-password" minlength="8" required>
            <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></small>
            <button class="btn btn-primary" type="submit">Crear cuenta</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
