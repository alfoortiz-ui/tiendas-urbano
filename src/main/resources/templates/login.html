<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendas Urbano | Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="section">
    <div class="container form-page">
        <h1>Iniciar sesión</h1>
        <p th:if="${param.error}" class="form-error" role="alert">No fue posible iniciar sesión con esos datos.</p>
        <p th:if="${param.logout}" class="form-success" role="status">La sesión se cerró correctamente.</p>
        <p th:if="${param.registered}" class="form-success" role="status">Cuenta creada. Ya puedes iniciar sesión.</p>
        <form method="post" th:action="@{/login}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <label for="email">Correo electrónico</label>
            <input id="email" name="username" type="email" autocomplete="email" required>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-primary" type="submit">Ingresar</button>
        </form>
        <p>¿No tienes cuenta? <a th:href="@{/register}">Regístrate</a>.</p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
