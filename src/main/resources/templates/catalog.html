<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendas Urbano | Catálogo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div th:replace="~{fragments/header :: header}"></div>
<main class="section">
    <div class="container">
        <div class="section-head">
            <p class="eyebrow">Colección disponible</p>
            <h1>Catálogo</h1>
            <p>Productos activos y publicables para consulta local.</p>
        </div>
        <form class="catalog-filters" method="get" th:action="@{/catalog}">
            <label for="catalog-query">Buscar</label>
            <input id="catalog-query" name="q" type="search" th:value="${query}" placeholder="Chaqueta, blazer...">
            <label for="catalog-category">Categoría</label>
            <input id="catalog-category" name="category" type="text" th:value="${category}" placeholder="Ej. Blazers">
            <label class="checkbox-label" for="catalog-available">
                <input id="catalog-available" name="available" value="true" type="checkbox">
                Solo con disponibilidad
            </label>
            <button class="btn btn-primary" type="submit">Filtrar</button>
        </form>
        <div class="card-grid products" th:if="${!products.isEmpty()}">
            <article class="card" th:each="product : ${products}">
                <div class="card-body">
                    <p class="category" th:text="${product.category}">Categoría</p>
                    <h2 th:text="${product.name}">Producto</h2>
                    <p th:text="${product.description}">Descripción</p>
                    <p class="price" th:text="${'$' + product.price}">$0</p>
                    <p th:text="${product.available ? 'Disponible' : 'Agotado'}">Disponibilidad</p>
                    <a class="btn btn-outline" th:href="@{/product(id=${product.id})}">Ver detalle</a>
                </div>
            </article>
        </div>
        <p class="feedback" th:if="${products.isEmpty()}">No encontramos productos con esos filtros.</p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
